<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffeff4"><title>デイリーミッション</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#342c38;background:#fff5f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid #f0dce4;padding:18px 18px 12px;position:sticky;top:0;z-index:4}h1{font-size:21px;margin:0}header small{color:#9c7488}main{max-width:560px;margin:auto;padding:16px 16px 110px}.card{background:#fff;border:1px solid #f1dce5;border-radius:20px;padding:17px;margin-bottom:15px;box-shadow:0 5px 25px #78445c0b}.soft{background:#fff3f7}.muted{color:#997b8c;font-size:13px}.big{font-size:28px;font-weight:900}.hero{height:300px;border-radius:18px;background:linear-gradient(155deg,#ffebf3,#ffe1bf);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.hero img{width:100%;height:100%;object-fit:contain;object-position:center bottom;transform:translate(var(--px,0px),var(--py,0px)) scale(var(--sc,1));}.placeholder{text-align:center;font-size:18px;font-weight:bold;color:#b66a93}.bubble{background:white;border-radius:17px;padding:14px;margin-top:-12px;position:relative;border:1px solid #f2d7e1;min-height:58px;line-height:1.7}.primary{background:#ee74a7;color:white;border:0;border-radius:13px;font-weight:bold;padding:14px}.secondary{background:white;color:#865d72;border:1px solid #e7c7d6;border-radius:13px;padding:12px}.full{width:100%}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid #f0dce4;padding:9px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav>button{border:0;background:none;color:#8c7383;font-size:11px;padding:7px 8px;min-width:65px}.nav>button.active{color:#e15893;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{background:#fff7fa;border:1px solid #f0d9e3;border-radius:15px;padding:14px;text-align:left;color:#554153;font-weight:700}label{display:block;margin:14px 0 5px;font-size:13px;font-weight:bold}select,textarea,input[type=text]{width:100%;border:1px solid #dfcad5;border-radius:11px;padding:12px;background:#fff;color:#342c38}textarea{min-height:80px}button:disabled{opacity:.5}.pill{display:inline-block;background:#ffe5ef;color:#a04475;border-radius:50px;padding:5px 9px;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.record{border-bottom:1px solid #f4e3e9;padding:12px 0}.record:last-child{border:0}.award{padding:13px;border-radius:12px;background:#fff4f7;margin:8px 0}.locked{opacity:.5}.hidden{display:none!important}p{line-height:1.7}h2{font-size:19px;margin:5px 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}input[type=range]{width:100%}
</style></head><body>
<header><h1>🌸 デイリーミッション</h1><small>他人って、なんか面白い。</small></header><main id="app"></main>
<nav class="nav" id="nav"></nav>
<script>
(()=>{
"use strict";
const KEY="daily-mission-v1";
const initial={records:[],seen:[],portrait:null,position:{x:0,y:0,scale:1},intro:true};
let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{state={...initial}};
let page="home",sessionTalk=null,unlocks=[],lastRecorded=null;
const now=()=>new Date().toLocaleDateString("sv-SE");
const fmt=d=>new Date(d).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{return false}};
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
const btn=(label,click,cls="secondary")=>{const b=el("button",label,cls);b.onclick=click;return b};
const card=(parent,cls="card")=>{const c=el("section",null,cls);parent.append(c);return c};
const add=(parent,tag,text,cls)=>{const a=el(tag,text,cls);parent.append(a);return a};
const quantity=r=>Math.max(1,Math.min(999,Number(r.quantity)||1));
const sum=rs=>rs.reduce((n,r)=>n+quantity(r),0);
const today=()=>state.records.filter(r=>r.date===now());
const real=()=>state.records.filter(r=>r.location!=="ギャル");
const counts=()=>({all:sum(state.records),real:sum(real()),days:new Set(state.records.map(r=>r.date)).size,near:sum(state.records.filter(r=>r.location==="近所")),conversation:sum(state.records.filter(r=>["軽い会話","長い会話"].includes(r.kind))});
const achievements=[
{id:"hello",label:"はじめまして！",desc:"最初の交流を記録",ok:c=>c.all>=1,reply:"うわ、初記録！ これからよろしくー！"},
{id:"ten",label:"遠慮はいらねえ！",desc:"累計10回の交流",ok:c=>c.all>=10,reply:"もう10回！？ あたしの話、間違ってたらツッコんでいいからね！"},
{id:"neighbor",label:"ご近所の顔",desc:"近所で10回の交流",ok:c=>c.near>=10,reply:"近所で顔、広くなってきたんじゃない？"},
{id:"talker",label:"話が尽きない人",desc:"会話を10回記録",ok:c=>c.conversation>=10,reply:"おしゃべり仲間が増えたね！"},
{id:"hundred",label:"人類観測装置",desc:"交流を100回記録",ok:c=>c.all>=100,reply:"100回！？ あたし、なんか感動してきた！"}
];
const talks=[
{id:"a",text:"ねえ、知らない人ってさ、話した瞬間にもう『知らない人』じゃなくなるのかな？ どこから知り合いなんだろねｗ"},
{id:"b",text:"挨拶って、世界でやり方違うらしいよ。手を振ったり、お辞儀したり。人間、工夫しすぎじゃない？"},
{id:"c",text:"なんかさ、道ですれ違う人にも、みんなそれぞれ一日があるんだよね。あたりまえだけど、ちょっと不思議！"},
{id:"d",text:"あたし、昨日から『他人』のこと考えてんだけど……他人って自分以外の全員じゃん？ 多すぎない？ｗ"},
{id:"e",text:"人間のこと調べるの超好きなんだけどさ、人間のことぜんっぜん分かんないんだよね。マジなんなのｗ"},
{id:"f",text:"ねー、何回も会うと親しみを感じやすくなる『単純接触効果』ってのがあるんだって。ただし誰にでも必ず効くわけじゃないらしい！"},
{id:"g",requires:"ten",text:"エビングハウスの忘却曲線ってさ、勉強したら一時間で何でも半分忘れるってことなんだって！ ……え、違う？",correction:"正確には、無意味音節の記憶実験に基づく結果で、あらゆる勉強にその割合をそのまま当てはめられない。",response:"えっ、そういうこと！？ じゃああたしの数学の点数は別件かー！"}
];
function pickTalk(){const available=talks.filter(t=>!t.requires||achievements.find(a=>a.id===t.requires)?.ok(counts()));const fresh=available.filter(t=>!state.seen.includes(t.id));const choices=fresh.length?fresh:available;const t=choices[Math.floor(Math.random()*choices.length)];state.seen.push(t.id);if(state.seen.length>talks.length*3)state.seen=state.seen.slice(-talks.length);save();return t}
function speaker(parent,text){const c=card(parent);const area=add(c,"div",null,"hero");if(state.portrait || true){const i=el("img");i.src=state.portrait || "./A1E0D09E-B5CD-4EE7-9974-568AA9A79044.png";i.style.setProperty("--px",state.position.x+"px");i.style.setProperty("--py",state.position.y+"px");i.style.setProperty("--sc",state.position.scale);area.append(i)}else{add(area,"div","ここにギャル登場！\n（データ管理から立ち絵を登録）","placeholder")}add(c,"div",text,"bubble");return c}
function nav(){const n=document.getElementById("nav");n.replaceChildren();for(const [id,symbol,label] of [["home","🏠","ホーム"],["log","👋","挨拶"],["awards","🏆","称号"],["stats","📊","記録"],["data","⚙️","管理"]]){const b=btn(symbol+"\n"+label,()=>{page=id;render()},page===id?"active":"");b.style.whiteSpace="pre-line";n.append(b)}}
function render(){nav();const root=document.getElementById("app");root.replaceChildren();if(page==="home")home(root);if(page==="log")log(root);if(page==="awards")awards(root);if(page==="stats")stats(root);if(page==="data")data(root)}
function home(root){speaker(root,state.intro?"こんちはー！ あたし、人間の話が大好きなんだ。誰かと挨拶したら教えてよ！ あたしにも挨拶していいからね！":"こんちはー！ 今日どんな感じ？");
state.intro=false;save();const c=card(root);add(c,"div","今日の交流","muted");add(c,"div",sum(today())+" 回","big");add(c,"p",today().length?"今日はもう誰かとつながったんだね！":"まだゼロでも全然OK。そんな日もあるっしょ！");c.append(btn("今日の交流を記録する 👋",()=>{page="log";sessionTalk=null;render()},"primary full"));const g=card(root);add(g,"h2","いろいろ見てみる");const grid=add(g,"div",null,"grid");[["🏆 称号","awards"],["📊 記録と傾向","stats"],["⚙️ データ管理","data"],["👋 挨拶を記録","log"]].forEach(([label,id])=>grid.append(btn(label,()=>{page=id;render()},"tile")))}
function log(root){if(sessionTalk){speaker(root,sessionTalk.text);if(sessionTalk.correction){const c=card(root);add(c,"p","この話、どうする？");c.append(btn("ん？ それちょっと違くね？",()=>{c.replaceChildren();add(c,"h2","正確には……");add(c,"p",sessionTalk.correction);add(c,"p","ギャル「"+sessionTalk.response+"」");c.append(btn("また記録する",()=>{sessionTalk=null;render()},"primary full"))},"secondary full"))}else{const c=card(root);c.append(btn("また記録する",()=>{sessionTalk=null;render()},"primary full"))}if(unlocks.length){const a=card(root);add(a,"h2","🎊 実績解除！");unlocks.forEach(x=>{add(a,"p","『"+x.label+"』");add(a,"p","ギャル「"+x.reply+"」")})}return}
speaker(root,"おっ、報告？ 今日はどんな交流があった？");const c=card(root);add(c,"h2","今日の交流を記録");const form=el("form");c.append(form);
const field=(title,values)=>{add(form,"label",title);const s=el("select");values.forEach(x=>{const o=el("option",x);o.value=x;s.append(o)});form.append(s);return s};
const kind=field("交流の種類",["挨拶","会釈","微笑む","軽い会話","長い会話"]);const location=field("相手との関係・場所",["近所","家族","近所以外","職場","友人・知人","ギャル"]);const who=field("どんな相手？",["おばあちゃん","おじいちゃん","おばさん","おじさん","おねえさん","おにいさん","同年代","こども","家族","友人・知人","その他","ギャル"]);add(form,"label","人数・回数（まとめて記録）");const qty=el("input");qty.type="number";qty.min="1";qty.max="999";qty.step="1";qty.value="1";qty.inputMode="numeric";qty.setAttribute("aria-label","交流した回数");form.append(qty);add(form,"p","例：河原で同じ種類の挨拶を5回したら「5」。ギャルの会話報酬は記録1回につき1つだよ。","muted");add(form,"label","ひとこと（任意）");const note=el("textarea");note.placeholder="今日は嵐の話で盛り上がった！";form.append(note);const submit=el("button","記録してギャルと話す！","primary full");submit.type="submit";submit.style.marginTop="15px";form.append(submit);
form.onsubmit=e=>{e.preventDefault();const n=Number(qty.value);if(!Number.isInteger(n)||n<1||n>999){alert("回数は1〜999の整数で入力してね");return}const before=counts();const previous=achievements.filter(a=>a.ok(before)).map(a=>a.id);state.records.push({id:Date.now()+"-"+Math.random().toString(36).slice(2),date:now(),at:new Date().toISOString(),quantity:n,kind:kind.value,location:location.value,who:who.value,note:note.value.trim()});const after=counts();unlocks=achievements.filter(a=>a.ok(after)&&!previous.includes(a.id));sessionTalk=pickTalk();save();render()}}
function awards(root){add(root,"h2","🏆 称号・実績");add(root,"p","挨拶するほど、ギャルとの会話も少しずつ増えていく。","muted");const c=counts();for(const a of achievements){const ok=a.ok(c);const b=card(root,"card"+(ok?"":" locked"));add(b,"h2",(ok?"🏅 ":"🔒 ")+a.label);add(b,"div",a.desc,"muted");if(ok)add(b,"p","ギャル「"+a.reply+"」")}}
function bar(parent,label,n,max){const row=add(parent,"div",null);row.style.margin="14px 0";const heading=add(row,"div",null,"row");add(heading,"span",label);add(heading,"strong",n+" 回");const track=add(row,"div",null);track.style.cssText="height:12px;background:#ffedf3;border-radius:20px;overflow:hidden;margin-top:6px";const fill=add(track,"div",null);fill.style.cssText="height:100%;width:"+Math.round(n/max*100)+"%;background:#ee74a7;border-radius:20px;transition:width .3s"}
function stats(root){add(root,"h2","📊 記録と傾向");const c=card(root),t=counts();const grid=add(c,"div",null,"grid");for(const [name,num] of [["累計交流",t.all],["実際の交流",t.real],["記録した日",t.days],["会話",t.conversation]]){const b=card(grid,"tile");add(b,"div",name,"muted");add(b,"div",num+" 回","big")}add(root,"h2","直近7日間の交流");const week=card(root);const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(6-i));const key=[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");return {label:(d.getMonth()+1)+"/"+d.getDate(),n:sum(state.records.filter(r=>r.date===key))}});const max=Math.max(1,...days.map(d=>d.n));for(const d of days)bar(week,d.label,d.n,max);add(root,"h2","交流の種類");const a=card(root);const groups=["挨拶","会釈","微笑む","軽い会話","長い会話"].map(k=>({label:k,n:sum(state.records.filter(r=>r.kind===k))}));const biggest=Math.max(1,...groups.map(g=>g.n));for(const g of groups)bar(a,g.label,g.n,biggest);add(root,"h2","最近の記録");const rec=card(root);if(!state.records.length)add(rec,"p","まだ記録なし。最初の一回を楽しみにしてるよ！");for(const r of [...state.records].reverse().slice(0,30)){const line=add(rec,"div",null,"record");add(line,"div",fmt(r.at)+"　"+r.kind+" ×"+quantity(r)+" / "+r.location);add(line,"div",r.who+(r.note?" ・ "+r.note:""),"muted");line.append(btn("削除",()=>{if(confirm("この記録を削除する？")){state.records=state.records.filter(x=>x.id!==r.id);save();render()}}))}}
function data(root){add(root,"h2","⚙️ データ管理");const c=card(root);add(c,"h2","ギャルの立ち絵");add(c,"p","完成済みの画像をここで登録できます。画像はこのブラウザ内だけに保存されます。","muted");const input=el("input");input.type="file";input.accept="image/*";c.append(input);input.onchange=()=>{const file=input.files[0];if(!file)return;if(file.size>3*1024*1024){alert("画像は3MB以下にしてください");return}const reader=new FileReader();reader.onload=()=>{state.portrait=reader.result;if(!save())alert("保存領域が不足しました。軽い画像に変更してください");render()};reader.readAsDataURL(file)};if(state.portrait)c.append(btn("画像を外す",()=>{state.portrait=null;save();render()}));for(const [k,label,min,max,step] of [["x","横位置",-200,200,1],["y","縦位置",-200,200,1],["scale","倍率",0.5,2.5,0.05]]){add(c,"label",label+"： "+state.position[k]);const range=el("input");range.type="range";range.min=min;range.max=max;range.step=step;range.value=state.position[k];range.oninput=()=>{state.position[k]=Number(range.value);save();render()};c.append(range)}const b=card(root);add(b,"h2","バックアップ");b.append(btn("JSONを書き出す",()=>{const blob=new Blob([JSON.stringify({...state,portrait:null},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="daily-mission-"+now()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},"primary full"));add(b,"p","バックアップに立ち絵画像は含みません。画像は別途保存してください。","muted");const restore=el("input");restore.type="file";restore.accept=".json,application/json";b.append(restore);restore.onchange=()=>{const f=restore.files[0];if(!f)return;f.text().then(t=>{try{const v=JSON.parse(t);if(!Array.isArray(v.records))throw Error();if(confirm("現在の記録を上書きして復元する？")){state={...initial,...v,portrait:state.portrait};save();render()}}catch{alert("正しいバックアップファイルではありません")}})};add(b,"p","データは端末・ブラウザ単位で保存されます。別端末には自動同期されません。","muted")}
render();
})();
</script></body></html>
